experiment:
  name: "ai_avatar_perception_study"
  version: "3.0.0"
  viewing_time_limit_ms: 3000
  random_seed: 42

benchmark:
  warmup_runs: 20            # per load level, discarded
  benchmark_runs: 30         # per load level
  load_levels: [1, 2, 5, 10, 20, 50, 100]   # trials per batch
  edge_cases:                # synthetic trials added to the pool
    - {stimulus_id: "synthetic_anticipatory", is_ai: 1, user_choice: 1, response_time_ms: 120}

dataset:
  sample_logs_path: "data/sample/sample_logs.csv"      # pilot sample, used by the tests
  # CSV analysed by process_data / visualize / notebook / benchmark. Pilot by default.
  # After data collection: python src/import_web_data.py, then switch to "data/real/participant_trials.csv".
  human_trials_path: "data/sample/sample_logs.csv"
  jsonl_output_path: "data/raw/test_run.jsonl"
  metadata_path: "data/raw/run_metadata.json"
  processed_dir: "data/processed"
  figures_dir: "reports/figures"

stats:
  bootstrap_iterations: 2000
  ci_level: 95.0
  iqr_factor: 1.5

guardrails:
  max_allowed_tir_percent: 15.0   # max share of invalid trials
  min_valid_rt_ms: 200
  max_valid_rt_ms: null             # no upper limit by default; set a number (ms) to exclude very slow trials
  # Optional per-condition upper limit. Without a time limit slow answers can be legitimate,
  # so decide this threshold BEFORE looking at the real data. Example:
  # max_valid_rt_ms_by_condition: {unrestricted: 60000}
  max_valid_rt_ms_by_condition: {}
  # Rules for the real (web) data; they are skipped when the columns are absent (pilot file).
  exclude_focus_lost: true          # trials where the participant switched tabs / minimised the window
  max_exposure_overshoot_ms: 150    # 3s_limit: face visible longer than limit + this = timer failure
